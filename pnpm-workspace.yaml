  - effect@4.0.2
  - '@effect/platform-node-shared@4.0.2'
  - '@effect/platform-node@4.0.2'
patchedDependencies:
  '@nickwelsh/docs-base@1.0.0': patches/@nickwelsh__docs-base@1.0.0.patch
  '@nickwelsh/refquill@0.1.0': patches/@nickwelsh__refquill@0.1.0.patch
  waku@1.0.0-rc.3: patches/waku@1.0.0-rc.3.patch
