name: Check
on:
  push:
    branches:
      - main
    tags: ['v*']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: pnpm install --frozen-lockfile
      - run: composer install --working-dir=packages/laravel --no-interaction --prefer-dist
      - run: pnpm exec vp run build
      - run: pnpm exec vp check
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vp test run
      - run: node packages/generator/dist/cli.js generate --config examples/react/formbraid.config.ts --check
      - run: pnpm packages:pack
      - run: pnpm packages:check
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      - run: pnpm packages:smoke
      - name: Save verified npm packages
        if: github.event_name == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: formbraid-npm
          path: artifacts/npm/*.tgz
          if-no-files-found: error
      - run: pnpm docs:check
      - name: Verify documentation in the Workers runtime
        run: pnpm --filter @formbraid/docs test
      - name: Validate the documentation deployment
        run: pnpm --filter @formbraid/docs deploy:check
      - name: Save verified release documentation
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: formbraid-docs
          path: apps/docs/.cloudflare/output
          include-hidden-files: true
          if-no-files-found: error
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - run: composer install --working-dir=packages/laravel --no-interaction --prefer-dist
      - run: composer --working-dir=packages/laravel test
      - run: composer --working-dir=packages/laravel check
      - run: php packages/laravel/vendor/bin/pint --test packages/laravel/src packages/laravel/tests examples/react/php

  deploy-docs:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [typescript, php]
    runs-on: ubuntu-latest
    concurrency:
      group: formbraid-docs-production
      cancel-in-progress: false
    environment:
      name: cloudflare
      url: https://docs.nickwelsh.me/formbraid
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: formbraid-docs
          path: apps/docs/.cloudflare/output
      - name: Deploy the verified release documentation
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set CLOUDFLARE_API_TOKEN in the cloudflare environment'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set CLOUDFLARE_ACCOUNT_ID in the cloudflare environment'; exit 1; }
          pnpm --filter @formbraid/docs deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
