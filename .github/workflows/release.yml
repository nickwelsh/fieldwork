name: Stage release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: formbraid-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/check.yml

  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.2.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: formbraid-npm
          path: artifacts/npm
      - name: Stage the exact verified packages for maintainer approval
        run: node scripts/npm-release.ts stage
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}

  composer:
    needs: verify
    uses: ./.github/workflows/sync-php.yml
    with:
      ref: ${{ github.sha }}
      tag: ${{ github.event.release.tag_name }}
    secrets:
      PHP_MIRROR_SSH_KEY: ${{ secrets.PHP_MIRROR_SSH_KEY }}
